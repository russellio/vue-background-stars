name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3

      # Allowlist, not denylist. `update-type` is the empty string whenever
      # fetch-metadata cannot classify the PR, and `!= 'semver-major'` would
      # treat that as safe. Enumerating what may merge makes an unrecognised
      # value fall through to manual review instead.
      - name: Enable auto-merge (patch and minor only)
        if: |
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag for manual review
        if: |
          steps.dependabot-metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.dependabot-metadata.outputs.update-type != 'version-update:semver-minor'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ Not auto-merged — detected update type \`${UPDATE_TYPE:-<unknown>}\`. Only patch and minor bumps auto-merge. Please review manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
