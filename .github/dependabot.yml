version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # @vitest/* packages pin vitest as an exact peer, so they must move
      # in lockstep or npm install fails with ERESOLVE.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      # Everything else minor/patch goes in one PR. Separate PRs each edit
      # pnpm-lock.yaml, and merging them back-to-back textually merged
      # overlapping hunks (vue-tsc@3.3.14 ended up triplicated, breaking
      # pnpm install). One PR per directory per run avoids that.
      npm-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the Go-native rewrite and ships no JS compiler API,
      # so Volar/vue-tsc cannot embed it. Vue projects must stay on 6.x until
      # TS exposes a stable programmatic API.
      # https://github.com/vuejs/language-tools/issues/5381
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "npm"
    directory: "/demo"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "demo"
    groups:
      # See npm-minor-patch note above — one lockfile-editing PR at a time.
      demo-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # See note above — vue-tsc cannot run on TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
